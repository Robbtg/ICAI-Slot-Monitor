name: ICAI Slot Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: icai-slot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run ICAI monitor
        env:
          PYTHONPATH: src
          ICAI_TELEGRAM_BOT_TOKEN: ${{ secrets.ICAI_TELEGRAM_BOT_TOKEN }}
          ICAI_TELEGRAM_CHAT_ID: ${{ secrets.ICAI_TELEGRAM_CHAT_ID }}
        run: |
          python -m icai_slot_monitor.cli \
            --config config/config.yaml \
            --state state/state.json \
            --once

      - name: Commit changed state
        if: always()
        run: |
          if git diff --quiet -- state/state.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "icai-slot-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: update slot monitor state"
          git push
