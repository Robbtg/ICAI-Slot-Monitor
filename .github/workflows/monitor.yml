name: ICAI Slot Monitor

# ============================================================
# SCHEDULING STRATEGY
# ============================================================
# GitHub's cron fires at most every 5 minutes, but is unreliable under load.
# Instead, this workflow fires every ~6 hours and the Python process runs
# a continuous loop internally, checking every ~1 minute for ~350 minutes.
#
# This ensures ~1-minute checks even when GitHub's scheduler is delayed.
#
# Four daily sessions (IST):
#   Session 1: ~00:02 IST → ~05:52 IST   (cron: 18:32 UTC prev day)
#   Session 2: ~06:02 IST → ~11:52 IST   (cron: 00:32 UTC)
#   Session 3: ~12:02 IST → ~17:52 IST   (cron: 06:32 UTC)
#   Session 4: ~18:02 IST → ~23:52 IST   (cron: 12:32 UTC)
#
# Times are offset from the exact hour to reduce scheduler congestion.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Monitoring session duration in minutes (default: 350)"
        required: false
        default: "350"
      interval_seconds:
        description: "Check interval in seconds (default: 60)"
        required: false
        default: "60"

  schedule:
    # Session 1: 00:02 IST = 18:32 UTC (previous day)
    - cron: "32 18 * * *"
    # Session 2: 06:02 IST = 00:32 UTC
    - cron: "32 0 * * *"
    # Session 3: 12:02 IST = 06:32 UTC
    - cron: "32 6 * * *"
    # Session 4: 18:02 IST = 12:32 UTC
    - cron: "32 12 * * *"

# Prevent two monitoring sessions from running simultaneously.
# cancel-in-progress: false ensures a running session is never killed by a new one.
concurrency:
  group: icai-slot-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    name: ICAI Slot Monitor (Long-Running)
    runs-on: ubuntu-latest

    # GitHub hosted runners have a hard limit of 360 minutes.
    # Keep safely below at 358 to allow startup/teardown overhead.
    timeout-minutes: 358

    env:
      PYTHONPATH: src
      ICAI_TELEGRAM_BOT_TOKEN: ${{ secrets.ICAI_TELEGRAM_BOT_TOKEN }}
      ICAI_TELEGRAM_CHAT_ID: ${{ secrets.ICAI_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Validate configuration
        run: |
          python -c "
          from icai_slot_monitor.config import load_config
          cfg = load_config('config/config.yaml')
          print(f'Config OK — {len(cfg.watches)} watches configured:')
          for w in cfg.watches:
              print(f'  [{w.name}] region={w.region} pou={w.pou} course_exact={w.course_exact!r}')
          print(f'Loop: {cfg.monitor.loop_minutes} min, Interval: {cfg.monitor.interval_seconds}s')
          "

      - name: Run ICAI monitor (long-running loop)
        run: |
          LOOP_MINUTES="${{ github.event.inputs.loop_minutes || '350' }}"
          INTERVAL_SECONDS="${{ github.event.inputs.interval_seconds || '60' }}"

          echo "=================================================="
          echo "Starting ICAI monitoring session"
          echo "Duration : ${LOOP_MINUTES} minutes"
          echo "Interval : ${INTERVAL_SECONDS} seconds"
          echo "=================================================="

          python -m icai_slot_monitor.cli \
            --config config/config.yaml \
            --state state/state.json \
            --loop-minutes "${LOOP_MINUTES}" \
            --interval-seconds "${INTERVAL_SECONDS}"

      - name: Session complete
        if: always()
        run: |
          echo "=================================================="
          echo "ICAI monitoring session ended."
          echo "=================================================="
