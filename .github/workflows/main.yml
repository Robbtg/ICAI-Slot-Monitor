import subprocess
import json
import base64

content = """name: ICAI Slot Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: icai-slot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run ICAI monitor
        env:
          PYTHONPATH: src
          ICAI_TELEGRAM_BOT_TOKEN: ${{ secrets.ICAI_TELEGRAM_BOT_TOKEN }}
          ICAI_TELEGRAM_CHAT_ID: ${{ secrets.ICAI_TELEGRAM_CHAT_ID }}
        run: |
          python -m icai_slot_monitor.cli \\
            --config config/config.yaml \\
            --state state/state.json \\
            --once

      - name: Commit changed state
        if: always()
        run: |
          if git diff --quiet -- state/state.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "icai-slot-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: update slot monitor state"
          git push
"""

gh_path = r"C:\Program Files\GitHub CLI\gh.exe"

info_proc = subprocess.run(
    [gh_path, "api", "repos/Robbtg/ICAI-Slot-Monitor/contents/.github/workflows/main.yml"],
    capture_output=True,
    text=True,
    check=True,
)
data = json.loads(info_proc.stdout)
sha = data["sha"]

b64_content = base64.b64encode(content.encode("utf-8")).decode("ascii")

payload = json.dumps({
    "message": "fix(ci): remove unsupported timezone key from schedule trigger",
    "content": b64_content,
    "sha": sha,
    "branch": "main",
})

put_proc = subprocess.run(
    [gh_path, "api", "--method", "PUT", "repos/Robbtg/ICAI-Slot-Monitor/contents/.github/workflows/main.yml", "--input", "-"],
    input=payload,
    capture_output=True,
    text=True,
)
print("PUT returncode:", put_proc.returncode)
print("PUT stdout:", put_proc.stdout)
print("PUT stderr:", put_proc.stderr)

