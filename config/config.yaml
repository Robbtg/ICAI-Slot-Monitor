# ============================================================
# ICAI Slot Monitor — Configuration
# ============================================================
# DO NOT store Telegram credentials here.
# Use GitHub Secrets: ICAI_TELEGRAM_BOT_TOKEN, ICAI_TELEGRAM_CHAT_ID
# ============================================================

portal:
  url: "https://www.icaionlineregistration.org/launchbatchdetail.aspx"
  timeout_ms: 30000
  headless: true
  retries: 2

monitor:
  # Minimum available seats for a batch to be treated as qualifying.
  minimum_available_seats: 1
  alert_on_new_batch: true
  alert_on_seat_increase: true
  alert_on_return_to_available: true

  # Long-running loop settings (used by --loop-minutes and --interval-seconds).
  # Keep loop_minutes safely below GitHub's 360-minute job limit.
  loop_minutes: 350
  interval_seconds: 60

  # Telegram mode.
  # summary_interval_minutes: Periodic status update interval in minutes.
  # summary_every_n_checks: Send a compact summary after this many checks (30 checks at 1m interval = 30m).
  # Batch-found alerts are always sent immediately.
  telegram_enabled: true
  summary_interval_minutes: 30
  summary_every_n_checks: 30

# ============================================================
# MONITORED TARGETS
# ============================================================
# Monitored course:
#   1. Advanced (ICITSS) MCS Course        (Chennai Advanced MCS)
#
# NOT monitored:
#   - AICITSS - Advanced Information Technology  (Chennai Advanced ITT)
#   - Advanced (ICITSS) MCS Course - Weekend
#   - ICITSS - Information Technology
#   - ICITSS - Orientation Course
# ============================================================

watches:
  - name: "Chennai Advanced MCS"
    region: "Southern"
    pou: "CHENNAI"
    # course_exact enforces an exact text match — prevents accidental
    # selection of the "Weekend" variant.
    course_exact: "Advanced (ICITSS) MCS Course"
    course_contains:
      - "Advanced"
      - "MCS"

