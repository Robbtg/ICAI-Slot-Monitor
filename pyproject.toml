[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icai-slot-monitor"
version = "1.1.0"
description = "Free ICAI public batch availability monitor with Telegram alerts"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.50,<2",
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
